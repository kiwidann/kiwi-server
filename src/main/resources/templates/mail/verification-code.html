<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>이메일 인증 코드</title>
</head>
<body style="margin:0; padding:0; background-color:#f5f5f5; font-family:Arial, sans-serif;">
<div style="max-width:600px; margin:40px auto; background:#ffffff; border:1px solid #e5e5e5; border-radius:12px; overflow:hidden;">
    <div style="padding:32px;">
        <h2 style="margin:0 0 16px; color:#222222;">
            <span th:text="${serviceName}">Kiwi</span> 이메일 인증
        </h2>

        <p style="margin:0 0 12px; color:#555555; line-height:1.6;">
            안녕하세요<br>
            아래 인증 코드를 입력하여 이메일 인증을 완료해주세요
        </p>

        <div style="margin:24px 0; padding:20px; background:#f8f9fa; border-radius:10px; text-align:center;">
            <span style="font-size:32px; font-weight:bold; letter-spacing:6px; color:#222222;"
                  th:text="${code}">123456</span>
        </div>

        <p style="margin:0; color:#777777; font-size:14px; line-height:1.6;">
            인증 코드는 5분 동안 유효합니다
        </p>
    </div>
</div>
</body>
</html>
