services:
  postgres:
    image: postgres:16
    container_name: kiwi-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  adminer:
    image: adminer
    container_name: kiwi-adminer
    ports:
      - "8081:8080"
    depends_on:
      - postgres

volumes:
  postgres-data: